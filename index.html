<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry Christmas — жонглирование Дедами Морозами</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #070b14;
    color: #cfd8e8;
    font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, 150vh);
    height: min(66.667vw, 100vh);
    image-rendering: auto;
    background: #0b1020;
    box-shadow: 0 0 60px #000a;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="900" height="600"></canvas></div>
  <script src="config.js"></script>
  <!-- Рекорды. Файл создаётся кнопкой «Сохранить в файл» в меню и кладётся
       рядом с index.html — тогда он переезжает вместе с игрой. Если файла
       нет, игра просто стартует с пустой таблицей. -->
  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
