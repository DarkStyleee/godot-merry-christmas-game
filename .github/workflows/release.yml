# Авторелиз: каждый пуш в main собирает exe и выкладывает его новым релизом.
# Номер считается сам, от последнего тега: v1.0, v1.1, v1.2 и так далее. Тег
# создаёт сам релиз, руками ставить нечего.
#
# Мажорную версию задаёт тег: `git tag v2.0 && git push origin v2.0` — тогда
# берётся он, а дальше счёт продолжится от него.
#
# Правки в *.md релиз не плодят. Ручной запуск (workflow_dispatch) собирает то
# же самое, но ничего не публикует: exe остаётся артефактом прогона.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write        # нужно, чтобы gh release create мог писать в репозиторий

# Два пуша подряд не должны считать один и тот же следующий номер.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true       # по ним считается следующий номер версии

      - name: Номер версии
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}"
          } else {
            $tags = @(git tag --list "v*" --sort=-v:refname)
            if ($tags.Count -eq 0) {
              $v = "v1.0"
            } else {
              $p = $tags[0].TrimStart("v").Split(".")
              $v = "v{0}.{1}" -f $p[0], ([int]$p[1] + 1)
            }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "версия релиза: $v"

      # Шаблоны экспорта весят под гигабайт и меняются только вместе с версией
      # движка — качать их на каждый релиз незачем.
      - name: Кэш шаблонов экспорта
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/AppData/Roaming/Godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Godot и шаблоны
        shell: pwsh
        run: |
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot/releases/download/$v"
          Invoke-WebRequest "$base/Godot_v${v}_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          if ("${{ steps.templates.outputs.cache-hit }}" -ne "true") {
            Invoke-WebRequest "$base/Godot_v${v}_export_templates.tpz" -OutFile templates.zip
            Expand-Archive templates.zip -DestinationPath tpz
            # Godot ищет шаблоны в папке, где версия записана через точку: 4.7.1.stable
            $dest = "$env:APPDATA\Godot\export_templates\$($v -replace '-', '.')"
            New-Item -ItemType Directory -Force $dest | Out-Null
            Move-Item tpz\templates\* $dest
          }

      # Номер релиза виден в углу меню, поэтому он же ложится в project.godot.
      - name: Версия в project.godot
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}".TrimStart("v")
          (Get-Content project.godot -Raw) -replace 'config/version="[^"]*"', "config/version=`"$v`"" |
            Set-Content project.godot -Encoding utf8 -NoNewline

      # На чистой машине .godot/ нет: он в .gitignore. Без импортированных
      # ассетов не пройдёт даже самопроверка.
      - name: Импорт ассетов
        shell: pwsh
        run: |
          & ".\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe" --headless --path . --import

      - name: Сборка
        shell: pwsh
        env:
          GODOT: ${{ github.workspace }}\godot\Godot_v4.7.1-stable_win64_console.exe
        run: .\tools\build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: MerryChristmas-${{ steps.ver.outputs.version }}
          path: build/MerryChristmas.exe

      # Тег создаётся вместе с релизом, на том же коммите.
      - name: Релиз
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.ver.outputs.version }} build/MerryChristmas.exe `
            --target ${{ github.sha }} --generate-notes
